
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eine kleine Überraschung</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#fff8f0,#211c20);
    --paper: light-dark(#fffdf9,#30272e);
    --ink: light-dark(#34272c,#fff4ec);
    --muted: light-dark(#806b70,#d4bdc5);
    --rose: light-dark(#e87991,#f39ab0);
    --rose-dark: light-dark(#b94f6a,#ffb2c3);
    --line: light-dark(#f0d8dc,#5b414b);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-rounded, system-ui, -apple-system,
      BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #app {
    min-height: 100svh;
    width: 100%;
    background: var(--bg);
    overflow: hidden;
    position: relative;
    display: grid;
    place-items: center;
    padding: 28px 16px;
  }
  .glow {
    position: absolute;
    width: 290px;
    height: 290px;
    border-radius: 50%;
    filter: blur(4px);
    opacity: .45;
    pointer-events: none;
  }
  .glow.one {
    top: -130px;
    left: -90px;
    background: #f6b8c6;
  }
  .glow.two {
    bottom: -150px;
    right: -90px;
    background: #f5d8a8;
  }
  .card {
    position: relative;
    width: min(100%, 440px);
    border: 1px solid var(--line);
    border-radius: 30px;
    background: var(--paper);
    padding: clamp(24px, 6vw, 38px);
    text-align: center;
    box-shadow: 0 18px 55px #6f3b4b16;
  }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: .18em;
    font-size: 11px;
    color: var(--muted);
    font-weight: 800;
  }
  .art {
    margin: 20px auto 16px;
    width: 210px;
    height: 180px;
    display: grid;
    place-items: center;
    position: relative;
  }
  .sun {
    position: absolute;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: light-dark(#ffe5bf,#684d46);
    top: 8px;
  }
  .alpaca {
    position: relative;
    font-size: 105px;
    line-height: 1;
    filter: drop-shadow(0 9px 4px #6d4a3b18);
    animation: bob 3.2s ease-in-out infinite;
  }
  .flower {
    position: absolute;
    font-size: 26px;
  }
  .f1 {
    left: 3px;
    bottom: 23px;
    transform: rotate(-15deg);
  }
  .f2 {
    right: 5px;
    bottom: 15px;
    transform: rotate(12deg);
  }
  h1 {
    margin: 10px 0 12px;
    font-size: clamp(30px, 8vw, 40px);
    line-height: 1.08;
    letter-spacing: -.04em;
  }
  h1 span { color: var(--rose-dark); }
  p {
    margin: 0 auto;
    max-width: 300px;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.65;
  }
  .reveal {
    margin: 24px 0 0;
    width: 100%;
    border: 0;
    border-radius: 999px;
    padding: 15px 20px;
    background: var(--rose);
    color: #fff;
    font: inherit;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 8px 18px #df718b35;
    transition: transform .2s, filter .2s;
  }
  .reveal:hover {
    transform: translateY(-2px);
    filter: brightness(1.04);
  }
  .message {
    display: none;
    margin-top: 22px;
    padding: 18px;
    border-radius: 18px;
    background: light-dark(#fff0f3,#47303b);
    border: 1px dashed var(--line);
    animation: appear .45s ease both;
  }
  .message.show { display: block; }
  .message strong {
    display: block;
    font-size: 19px;
    margin-bottom: 6px;
    color: var(--rose-dark);
  }
  .message p { font-size: 14px; }
  .foot {
    margin-top: 23px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: .08em;
  }
  .heart {
    position: fixed;
    z-index: 5;
    bottom: -30px;
    pointer-events: none;
    animation: floatUp 3.4s ease-in forwards;
  }
  @keyframes bob {
    0%,100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-7px) rotate(2deg); }
  }
  @keyframes appear {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes floatUp {
    to {
      transform: translateY(-110vh) rotate(25deg);
      opacity: 0;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    *,*::before,*::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<main id="app">
  <div class="glow one"></div>
  <div class="glow two"></div>
  <section class="card" aria-labelledby="headline">
    <div class="eyebrow">Eine kleine Überraschung für dich</div>
    <div class="art" aria-label="Niedliches Alpaka">
      <div class="sun"></div>
      <span class="flower f1">🌼</span>
      <span class="flower f2">🌷</span>
      <div class="alpaca">🦙</div>
    </div>
    <h1 id="headline">Let's go<br><span>Alpaka-Trekking!</span> 💗</h1>
    <p>Ich habe etwas Schönes für uns geplant …</p>
    <button class="reveal" id="surprise" type="button">
      Unsere Überraschung entdecken ✨
    </button>
    <div class="message" id="message" aria-live="polite">
      <strong>Ein kleines Abenteuer zu zweit 🥰</strong>
      <p>Wir gehen zusammen Alpaka-Trekking! Ich freue mich auf die Zeit mit dir. ❤️</p>
    </div>
    <div class="foot">DU + ICH + ALPAKAS</div>
  </section>
</main>
<script>
  const button = document.getElementById('surprise');
  const message = document.getElementById('message');

  button.addEventListener('click', () => {
    message.classList.add('show');
    button.textContent = 'Yaaay! 🦙💞';

    for (let i = 0; i < 18; i++) {
      const heart = document.createElement('span');
      heart.className = 'heart';
      heart.textContent = ['💗','💕','💖','✨'][
        Math.floor(Math.random() * 4)
      ];
      heart.style.left = (5 + Math.random() * 90) + 'vw';
      heart.style.fontSize = (16 + Math.random() * 18) + 'px';
      heart.style.animationDelay = (Math.random() * .8) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 4500);
    }
  });
</script>
</body>
</html>
